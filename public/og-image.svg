<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#181715"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#22211E" stroke="#383630" stroke-width="3"/>
  
  <!-- Grid decoration -->
