                "@type": "Answer",
                "text": "CPython executes source code in two distinct phases: first, the lexer tokenizes characters and the PEG parser builds an Abstract Syntax Tree (AST) to validate grammar at compile time. The compiler then emits compact stack-based bytecode cached in __pycache__ as .pyc files. Finally, the Python Virtual Machine (PVM) evaluation loop (_PyEval_EvalFrameDefault) executes these opcodes sequentially."

                "@type": "Answer",
                "text": "In CPython, every value—including integers, strings, functions, and classes—is a heap-allocated C struct called PyObject. Each PyObject carries two fundamental header fields: ob_refcnt (reference count tracking how many names point to it) and ob_type (a pointer to the object's type struct defining its behavior)."

              "name": "Why does Python have a Global Interpreter Lock (GIL)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "CPython uses the Global Interpreter Lock (GIL) to prevent race conditions on internal object reference counts (ob_refcnt). Only one operating system thread holds the GIL to execute Python bytecode at any instant. However, blocking I/O system calls and numerical libraries like NumPy release the GIL during heavy operations."
              }
            },

              "name": "Why is list.append() O(1) amortized while list.insert(0) is O(n)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Python lists are implemented as contiguous arrays of PyObject pointers with over-allocation (growing capacity by ~12.5% on resize). Appending places a pointer in pre-allocated empty slots in O(1) amortized time, whereas inserting at index 0 requires shifting every existing item in the array one slot to the right, which takes O(n) linear time."
